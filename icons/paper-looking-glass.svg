<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Vim code review</title>
  <desc id="description">A folded sheet of paper labeled vim in Courier New, with document lines enlarged inside a magnifying glass.</desc>
  <defs>
    <path id="document-lines" d="M28 51H100 M28 62H91 M28 73H100 M28 84H95 M28 95H100 M28 106H85"/>
    <clipPath id="lens-clip">
      <circle cx="77" cy="78" r="22"/>
    </clipPath>
  </defs>

  <!-- Paper and its folded upper-right corner. -->
  <path d="M22 8H84L112 36V114Q112 120 106 120H22Q16 120 16 114V14Q16 8 22 8Z" fill="#ffffff" stroke="#23364d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M84 8V30Q84 36 90 36H112Z" fill="#dceeff" stroke="#23364d" stroke-width="3" stroke-linejoin="round"/>

  <text x="27" y="39" font-family="'Courier New', Courier, monospace" font-size="25" font-weight="700" fill="#23364d">vim</text>
  <use href="#document-lines" fill="none" stroke="#839bb3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Opaque lens: redraw the same lines at 1.8 times their original size,
       scaling both their spacing and stroke width about the lens center. -->
  <circle cx="77" cy="78" r="22" fill="#eff7ff"/>
  <g clip-path="url(#lens-clip)">
    <use href="#document-lines" transform="translate(-61.6 -62.4) scale(1.8)" fill="none" stroke="#839bb3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Draw the handle behind the rim so the joint stays clean. -->
  <path d="M94 95L108 112" fill="none" stroke="#23364d" stroke-width="9" stroke-linecap="round"/>
  <path d="M96 98L107 111" fill="none" stroke="#54aeff" stroke-width="4" stroke-linecap="round"/>
  <circle cx="77" cy="78" r="23" fill="none" stroke="#23364d" stroke-width="5"/>
  <circle cx="77" cy="78" r="20" fill="none" stroke="#54aeff" stroke-width="1.5"/>
</svg>
